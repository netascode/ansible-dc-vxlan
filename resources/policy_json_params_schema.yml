      '0|[1-9]\\d?|1\\d\\d|2[0-9]|3[0-2]))?$',
      required=False,
      desc="IPv4 address, prefix or 'any'"
    )
  dest_ip: |-
    str(
      matches='^(any|(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?))*)(?:'
      '\\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?))?(?:\\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?))?(\\/('
      '0|[1-9]\\d?|1\\d\\d|2[0-9]|3[0-2]))?$',
      required=False,
      desc="IPv4 address, prefix or 'any'"
    )
  src_ipv6: str(matches='^(any|[A-Fa-f0-9:/]+)$', required=False, desc="IPv6 address, prefix or 'any'")
  dest_ipv6: str(matches='^(any|[A-Fa-f0-9:/]+)$', required=False, desc="IPv6 address, prefix or 'any'")
  src_port: |-
    str(
      matches='^(any|[A-Za-z0-9-]+)$',
      required=False,
      desc="Source port number, example any or 443. Value is ignored for 'IP' and 'icmp' protocol"
    )
  dest_port: |-
    str(
      matches='^(any|[A-Za-z0-9-]+)$',
      required=False,
      desc="Destination port number, example any or 443. Value is ignored for 'IP' and 'icmp' protocol"
    )
