  sequence_number: int(min=1, max=4294967295, desc='Min:1, max:4294967295')
  protocol: enum('icmp', 'ip', 'tcp', 'udp', desc='The protocol, example TCP.')
  src_ip: |-
    str(
      matches='^(any|(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?))*)(?:'
