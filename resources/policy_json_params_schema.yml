---
policy_aaa_tacacs_enhanced:
  TACACS_SERVERS: |-
    any(
      list(include('policy_aaa_tacacs_enhanced_TACACS_SERVERS'), min=1),
      str(min=1),
      required=False,
      desc='TACACS+ server host addresses and type-7 encrypted shared keys'
    )
policy_aaa_tacacs_enhanced_TACACS_SERVERS:
  aaa_server: ip(nd_type='ipaddresswithoutprefix', desc='IPv4/IPv6 address of a TACACS+ server')
  aaa_secret: str(min=1, max=63, desc='Type 7 encrypted secret used by this TACACS+ server, max size 63')
policy_AI_Fabric_QOS_Classification_Custom:
  QOSDATA: |-
    any(
      list(include('policy_AI_Fabric_QOS_Classification_Custom_QOSDATA'), min=1),
      str(min=1),
      desc='QoS classification and marking'
    )
policy_AI_Fabric_QOS_Classification_Custom_QOSDATA:
  class_map_label1: str(max=31, min=1, desc='A unique identifier for the class-map')
  match_type: str(min=1, desc='QoS classification type')
  match_values: |-
    str(
      max=128,
      min=1,
      desc="For cos, valid values are 0-7, multiple values with ',' or space separated, or range with '-'.  Fo"
      "r DSCP, valid values are 0-63, multiple values with ',' or space separated, or range with '-'.  DS"
      'CP also supports predefined strings representing different values: af11: 10, af12: 12, af13: 14, a'
      'f21: 18, af22: 20, af23: 22, af31: 26, af32: 28, af33: 30, af41: 34, af42: 36, af43: 38, cs1: 8, c'
      's2: 16, cs3: 24, cs4: 32, cs5: 40, cs6: 48, cs7: 56, default: 0, ef: 46.  These strings if used wi'
      'll be mapped to their numeric values.'
    )
  qos_group_label1_int: int(min=1, max=7, desc='Valid value is 1-7')
policy_community_list:
  standardCommunityListEntries: |-
    any(
      list(include('policy_community_list_standardCommunityListEntries'), min=1),
      str(min=1),
      required=False,
      desc='One or multiple standard community-list entries'
    )
  expandedCommunityListEntries: |-
    any(
      list(include('policy_community_list_expandedCommunityListEntries'), min=1),
      str(min=1),
      required=False,
      desc='One or multiple expanded community-list entries'
    )
policy_community_list_standardCommunityListEntries:
  sequence_number: int(min=1, max=4294967294, required=False, desc='Valid value is between [1-4294967294]')
  action: enum('permit', 'deny', required=False, desc='Permit or deny operation')
  blackhole: bool(required=False, desc='Blackhole (well-known community)')
  graceful_shutdown: bool(required=False, desc='Graceful shutdown (well-known community)')
  internet: bool(required=False, desc='Internet (well-known community)')
  local_asn: bool(required=False, desc='Do not send outside local as (well-known community)')
  no_advertise: bool(required=False, desc='Do not advertise to any peer (well-known community)')
  no_export: bool(required=False, desc='Do not export to next as (well-known community)')
  community_numbers: str(required=False, desc='Comma separated community number in ASN:nn format')
policy_community_list_expandedCommunityListEntries:
  sequence_number: int(min=1, max=4294967294, required=False, desc='Valid value is between [1-4294967294]')
  action: enum('permit', 'deny', required=False, desc='Permit or deny operation')
  community_number_regex: |-
    str(
      max=63,
      matches='^(?!.*[a-zA-Z~!#%@`]).*$',
      required=False,
      desc='Regular-expression (must use aa:nn format)'
    )
policy_dc_border_gateway_inband_setup:
  moreNdDataSubnet: |-
    any(
      list(include('policy_dc_border_gateway_inband_setup_moreNdDataSubnet'), min=1),
      str(min=1),
      required=False,
      desc='Additional ND data subnets'
    )
  dciIntfEntries: |-
    any(
      list(include('policy_dc_border_gateway_inband_setup_dciIntfEntries'), min=1),
      str(min=1),
      required=False,
      desc='DCI interface list'
    )
policy_dc_border_gateway_inband_setup_moreNdDataSubnet:
  additional_nd_data_subnet: ip(version=4, nd_type='ipv4addresswithsubnet', required=False, desc='Additional ND data subnet')
policy_dc_border_gateway_inband_setup_dciIntfEntries:
  dci_intf_name: str(required=False, desc='DCI interface that connects to campus fabric border gateway spines')
  intf_ip_address: |-
    ip(
      version=4,
      nd_type='ipv4address',
      required=False,
      desc='IP address of the DCI interface that connects to campus fabric border gateway spines'
    )
  intf_ip_mask_len: int(required=False, desc='DCI interface IP mask')
policy_dc_border_inband_setup:
  moreNdDataSubnet: |-
    any(
      list(include('policy_dc_border_inband_setup_moreNdDataSubnet'), min=1),
      str(min=1),
      required=False,
      desc='Additional ND data subnets'
    )
  edgeRouterEntries: |-
    any(
      list(include('policy_dc_border_inband_setup_edgeRouterEntries'), min=1),
      str(min=1),
      required=False,
      desc='Edge router list'
    )
policy_dc_border_inband_setup_moreNdDataSubnet:
  additional_nd_data_subnet: ip(version=4, nd_type='ipv4addresswithsubnet', required=False, desc='Additional ND data subnet')
policy_dc_border_inband_setup_edgeRouterEntries:
  edge_router_name: |-
    str(
      matches='^\\s*\\S+\\s*$',
      required=False,
      desc='Host name should not contain spaces in the middle'
    )
  edge_router_bgp_as: |-
    str(
      min=1,
      max=11,
      matches='^(((\\+)?[1-9]{1}[0-9]{0,8}|(\\+)?[1-3]{1}[0-9]{1,9}|(\\+)?[4]{1}([0-1]{1}[0-9]{8}|[2]{1}([0-8]{1}'
      '[0-9]{7}|[9]{1}([0-3]{1}[0-9]{6}|[4]{1}([0-8]{1}[0-9]{5}|[9]{1}([0-5]{1}[0-9]{4}|[6]{1}([0-6]{1}[0'
      '-9]{3}|[7]{1}([0-1]{1}[0-9]{2}|[2]{1}([0-8]{1}[0-9]{1}|[9]{1}[0-5]{1})))))))))|([1-5]\\d{4}|[1-9]'
      '\\d{0,3}|6[0-4]\\d{3}|65[0-4]\\d{2}|655[0-2]\\d|6553[0-5])(\\.([1-5]\\d{4}|[1-9]\\d{0,3}|6[0-4]\\d'
      '{3}|65[0-4]\\d{2}|655[0-2]\\d|6553[0-5]|0))?)$',
      required=False,
      desc='1-4294967295 | 1-65535[.0-65535]'
    )
  edge_router_ip: |-
    ip(
      version=4,
      nd_type='ipv4address',
      required=False,
      desc='IP address of the edge router interface that connects to this border'
    )
  local_intf_name: str(required=False, desc='Interface of local switch that connects to this edge router')
policy_Dynamic_Load_Balancing_CS:
  STATIC_PIN_LIST: |-
    any(
      list(include('policy_Dynamic_Load_Balancing_CS_STATIC_PIN_LIST'), min=1),
      str(min=1),
      required=False,
      desc="Note that destination port must be in 'applied DLB interface list'"
    )
policy_Dynamic_Load_Balancing_CS_STATIC_PIN_LIST:
  src_port: str(min=1, desc='Must be physical port')
  dst_port: str(min=1, desc='Must be part of DLB interface list')
policy_Dynamic_Load_Balancing_S1:
  STATIC_PIN_LIST: |-
    any(
      list(include('policy_Dynamic_Load_Balancing_S1_STATIC_PIN_LIST'), min=1),
      str(min=1),
      required=False,
      desc="Note that destination port must be in 'applied DLB interface list'. Static pinning is supported fr"
      'om NX-OS 10.6(2) onwards.'
    )
policy_Dynamic_Load_Balancing_S1_STATIC_PIN_LIST:
  src_port: str(min=1, desc='Must be physical port')
  dst_port: str(min=1, desc='Must be part of DLB interface list')
policy_errdisable_recovery:
  RECOVERY_CAUSES: |-
    any(
      list(include('policy_errdisable_recovery_RECOVERY_CAUSES'), min=1),
      str(min=1),
      required=False,
      desc='Applications for which errdisable recovery should be enabled. Selecting all generates every specif'
      'ic recovery cause.'
    )
policy_errdisable_recovery_RECOVERY_CAUSES:
  cause: |-
    enum(
      'all',
      'bpduguard',
      'dcbx-no-ack',
      'failed-port-state',
      'link-flap',
      'loopback',
      'pause-rate-limit',
      'psecure-violation',
      'security-violation',
      'storm-control',
      'udld',
      'vlan-membership',
      'vpc-peerlink',
      desc='Errdisable recovery cause'
    )
policy_ERSPAN:
  sources: any(list(include('policy_ERSPAN_sources'), min=1), str(min=1), required=False, desc='Sources')
  destinations: |-
    any(
      list(include('policy_ERSPAN_destinations'), min=1),
      str(min=1),
      required=False,
      desc='Destination interfaces must be in switchport monitor mode'
    )
  vlanFilters: |-
    any(
      list(include('policy_ERSPAN_vlanFilters'), min=1),
      str(min=1),
      required=False,
      desc='VLAN filter(s)'
    )
policy_ERSPAN_sources:
  source_type: enum('vlan', 'interface', 'sup-eth0', desc='Interface, sup-eth0 or VLAN')
  source_value: |-
    str(
      min=1,
      max=128,
      desc='One or more ethernet port(s) eg: ethernet1/1, e1/5-7, port-channel(s) eg: port-channel1, port-chan'
      'nel7-9, or VLAN(s) eg: 1,5'
    )
  direction_interface: |-
    enum(
      'tx',
      'rx',
      'both',
      required=False,
      desc='Traffic direction to copy as ingress, egress, or both.  Limited to rx only for sup-eth0 and VLAN'
    )
policy_ERSPAN_destinations:
  dest_value: |-
    str(
      min=1,
      max=128,
      desc='One or more ethernet port(s) eg: ethernet1/1, e1/5-7, or port channel(s) eg: port-channel1, port-c'
      'hannel7-9.  Destination interfaces must be in switchport monitor mode'
    )
policy_ERSPAN_vlanFilters:
  filter_value: str(min=1, max=128, desc='A VLAN, or comma separated list, or range of VLANs')
policy_Ext_VRF_Lite_SVI:
  BGP_NEIGHBOR_LIST: |-
    any(
      list(include('policy_Ext_VRF_Lite_SVI_BGP_NEIGHBOR_LIST'), min=1),
      str(min=1),
      required=False,
      desc='Add peerings to multiple neighbors over the same SVI'
    )
policy_Ext_VRF_Lite_SVI_BGP_NEIGHBOR_LIST:
  neighbor_ip: ip(version=4, nd_type='ipv4address', required=False, desc='BGP peer IPv4 address')
  neighbor_ipv6: ip(version=6, nd_type='ipv6address', required=False, desc='BGP peer IPv6 address')
  neighbor_asn: str(required=False, desc='BGP ASN of IPv4/IPv6 neighbor')
  bgp_password: str(min=1, max=164, required=False, desc='Hex string')
  bgp_password_key_type: |-
    enum(
      '3',
      '6',
      '7',
      required=False,
      desc='BGP key encryption type: 3 - 3DES, 6 - cisco type 6, 7 - cisco type 7'
    )
