# Policy JSON Params - generated Yamale validation schema
# ND 4.3.1.175, snapshot captured 2026-11-24.
# Generated with policy_json_params.yml by gen_policy_json_params_registry.py.
# Root keys are template_name values; includes use canonical registry field names.
# Native Yamale validators enforce types, enums, ranges, lengths and patterns.
# Scalars use native types; no environment-placeholder regex unions are emitted.
# Rule 550's scalar adapters exempt unresolved env_var_ placeholders at runtime.
# any(list(...), str(...)) is retained only for raw top-level string compatibility.
# desc is an error hint; nd_type lets rule 550 distinguish bare IPs/prefixes
# and normalize comma-separated IP lists. These metadata keywords are not
# additional native Yamale constraints; use rule 550 for the full NaC contract.
# Rule 550 drops known empty fields and normalizes numeric text/enum values
# in a validation-only copy. Raw top-level strings retain pass-through support.
# Conditional requirements and switch/interface existence stay with ND.
# Not covered by NaC VXLAN, so not listed: templates whose supported platforms
# are only ios-xe and/or ios-xr, that list n7k or vdc among their platforms,
# whose name starts with ios_xe, ios_xr_, ipfm_, nexus_cloud, nfm_, sonic_ or
# temp_, whose name ends with _internal, whose name contains _ipfm_, named
# import_type or interface_top, or that have no user-settable parameters unless
# they list all or n9k.
