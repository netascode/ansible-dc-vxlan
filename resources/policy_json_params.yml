# ══════════════════════════════════════════════════════════════════════════════
# Policy JSON Params — structured -> NDFC JSON-encoded nvPair registry
#
# Consumed by:
#   - plugins/action/common/prepare_plugins/prep_006_policy_json_params.py
#       Encodes structured template_vars into the JSON string NDFC expects.
#   - roles/validate/files/rules/common/550_policy_json_params.py
#       Selects the encoded keys; validates them with policy_json_params_schema.yml.
#
# Lets users author NDFC "structureArray" nvPairs (e.g. ip_acl ACES) as native,
# typed YAML lists instead of hand-escaped JSON strings. The prepare plugin
# converts each declared param into {"<wrapper_key>": [ {NDFC_FIELD: "value"} ]}
# and json-encodes it; ndfc_policy.j2 then emits it as a quoted scalar. Vars may
# be authored inline under template_vars or in an external .yml/.yaml file via
# the NaC `filename` convention — prep_006 loads the file before encoding.
#
# Entries are generated from the policy/device templates of Nexus Dashboard
# 4.3.1.175 (captured 2026-11-24): every template with a structureArray or
# string[]/ipAddress[] parameter that NaC VXLAN covers. Template, parameter and
# NDFC field names come from that release;
# existing snake_case field names are kept. NDFC nvPair names are preserved
# exactly; fields map snake_case -> nvPair name.
#
# Not covered by NaC VXLAN, so not listed: templates whose supported platforms
# are only ios-xe and/or ios-xr, that list n7k or vdc among their platforms,
# whose name starts with ios_xe, ios_xr_, ipfm_, nexus_cloud, nfm_, sonic_ or
# temp_, whose name ends with _internal, whose name contains _ipfm_, named
# import_type or interface_top, or that have no user-settable parameters unless
# they list all or n9k.
#
# Entry schema (per NDFC template_name):
#   json_params:                  # list of template_vars keys that are encoded
#     - key: <TEMPLATE_VARS_KEY>  # key under policy.template_vars holding the list
#       wrapper_key: <STR>        # optional; top-level JSON key (defaults to key)
#       fields:                   # snake_case (user) field -> NDFC nvPair field.
#                                 # The full field set NDFC expects. Omitted
#                                 # scalar fields become ""; complex fields
#                                 # retain their empty-container encoding.
#     - key: <TEMPLATE_VARS_KEY>  # NDFC string[]/ipAddress[] template parameter:
#       type: csv                 # YAML list of scalars -> comma-separated string
#
# Each `fields` value is one of:
#   1. NDFC field name (str)                        -> scalar nvPair
#   2. {ndfc: <NAME>, type: list}                   -> scalar list -> JSON array
#   3. {ndfc: <NAME>, type: csv}                    -> YAML list -> comma-
#                                                      separated string; NDFC
#                                                      "string[]"/"ipAddress[]"
#                                                      fields are read as CSV
#                                                      (e.g. route_map_enhanced
#                                                      prefixListNames).
#   4. {ndfc: <NAME>, type: structure_array,        -> NESTED structureArray;
#        wrapper_key: <STR>, fields: {...}}            fields recurse
#
# Validation is defined in policy_json_params_schema.yml, generated alongside
# this file. Rule 550 uses Yamale in strict mode before prep_006 encodes values.
#
# Complex fields (type list/structure_array) are JSON-stringified by default
# (NDFC nvPair values are strings). Add `stringify: false` to embed an inline
# nested JSON value instead. Example of a nested structureArray field:
#
#   entries:
#     type: structure_array
#     ndfc: entries
#     wrapper_key: entries
#     fields:
#       action: ACTION
#       sequence_number: SEQUENCE_NUMBER
#       rule_entries:                 # nested structureArray within each entry
#         type: structure_array
#         ndfc: RULE_ENTRIES
#         fields:
#           rule_type: RULE_TYPE
#           prefix_list_names: {ndfc: PREFIX_LIST_NAMES, type: csv}
#
# Backward compatible: if a user still supplies the value as a raw string
# it is left untouched (only list values are encoded).
# ══════════════════════════════════════════════════════════════════════════════

