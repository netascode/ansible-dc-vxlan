        nssa: NSSA
        nssa_suboption:
          ndfc: NSSA_SUBOPTION
          enum:
            - none
            - default-information-originate
            - no-redistribution
            - no-summary
            - translate
      required: [area_id]

snmp_server_enhanced:
  json_params:
    - key: SNMP_SOURCE_INTERFACES
      fields:
        notification_type:
          ndfc: NOTIFICATION_TYPE
          enum: [traps, informs]
        source_interface: SOURCE_INTERFACE
      required: [notification_type, source_interface]
    - key: SNMP_HOSTS
      fields:
        host_ip: HOST_IP
        source_interface: SOURCE_INTERFACE
        vrf: VRF
        notification_type:
          ndfc: NOTIFICATION_TYPE
          enum: [none, traps, informs]
        snmp_version:
          ndfc: SNMP_VERSION
          enum: ['1', '2c', '3']
        snmpv3_security_level:
          ndfc: SNMPV3_SECURITY_LEVEL
          enum: [noauth, auth, priv]
        community_or_username: COMMUNITY_OR_USERNAME
        udp_port: UDP_PORT
      required: [host_ip]
    - key: SNMP_USERS
      fields:
        username: USERNAME
        user_role:
          ndfc: USER_ROLE
          enum: [none, network-admin, network-operator, vdc-admin, vdc-operator]
        auth_algo:
          ndfc: AUTH_ALGO
          enum: [none, md5, sha, sha-224, sha-256, sha-384, sha-512]
        auth_password: AUTH_PASSWORD
        priv_protocol:
          ndfc: PRIV_PROTOCOL
          enum: [none, des, aes-128, aes-256]
        priv_password: PRIV_PASSWORD
        key_type:
          ndfc: KEY_TYPE
          enum: [none, localizedkey, localizedV2key]
        enforce_priv: ENFORCE_PRIV
        ipv4_acl: IPV4_ACL
      required: [username]
    - key: SNMP_ENABLED_TRAPS
      fields:
        trap_suffix: TRAP_SUFFIX
      required: [trap_suffix]
    - key: SNMP_CONTEXTS
      fields:
        context_name: CONTEXT_NAME
        vrf_name: VRF_NAME
      required: [context_name, vrf_name]

